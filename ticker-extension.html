<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>OYAK Şirket Bandı</title>

    <script src="./tableau.extensions.1.17.0.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            display: flex;
            align-items: center;
        }

        #ticker {
            white-space: nowrap;
            padding-left: 100%;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 15px;
            font-weight: bold;
            animation: marquee 25s linear infinite;
        }

        @keyframes marquee {
            from {
                transform: translateX(0);
            }

            to {
                transform: translateX(-100%);
            }
        }
    </style>
</head>

<body>

<div id="ticker">Yükleniyor...</div>

<script>

const SHEET_NAME = "Notes";
const FIELD_NAME = "Notes";

window.onload = init;

async function init() {

    try {

        console.log("Extension başlıyor...");

        if (typeof tableau === "undefined") {
            setText("Tableau API bulunamadı.");
            console.error("tableau undefined");
            return;
        }

        await tableau.extensions.initializeAsync();

        console.log("Initialize başarılı");

        const dashboard = tableau.extensions.dashboardContent.dashboard;

        console.log(
            "Worksheetler:",
            dashboard.worksheets.map(x => x.name)
        );

        const sheet = dashboard.worksheets.find(
            x => x.name === SHEET_NAME
        );

        if (!sheet) {

            setText(
                "Worksheet bulunamadı : " +
                SHEET_NAME
            );

            return;
        }

        await updateTicker(sheet);

        dashboard.worksheets.forEach(ws => {

            ws.addEventListener(
                tableau.TableauEventType.FilterChanged,
                async () => {

                    console.log("Filtre değişti");

                    await updateTicker(sheet);

                }
            );

        });

    }

    catch (e) {

        console.error(e);

        setText(e.message);

    }

}

async function updateTicker(sheet) {

    try {

        const table = await sheet.getSummaryDataAsync();

        console.log("Kolonlar:");

        table.columns.forEach(c =>
            console.log(c.fieldName)
        );

        let columnIndex = table.columns.findIndex(c =>
            c.fieldName.toLowerCase().includes(FIELD_NAME.toLowerCase())
        );

        if (columnIndex < 0)
            columnIndex = 0;

        const text = table.data
            .map(r => r[columnIndex].formattedValue)
            .filter(v => v)
            .join("   ●   ");

        setText(text);

    }

    catch (e) {

        console.error(e);

        setText(e.message);

    }

}

function setText(text) {

    const ticker = document.getElementById("ticker");

    ticker.style.animation = "none";

    ticker.offsetHeight;

    ticker.innerText = text;

    ticker.style.animation = "marquee 25s linear infinite";

}

</script>

</body>
</html>
