<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="utf-8">

<title>OYAK Ticker</title>

<script src="./tableau.extensions.1.latest.min.js"></script>

<style>

html,body{

margin:0;

height:100%;

background:black;

overflow:hidden;

display:flex;

align-items:center;

}

#ticker{

white-space:nowrap;

padding-left:100%;

font:600 15px Arial;

color:white;

animation:marquee 25s linear infinite;

}

@keyframes marquee{

0%{

transform:translateX(0);

}

100%{

transform:translateX(-100%);

}

}

</style>

</head>

<body>

<div id="ticker">

Yükleniyor...

</div>

<script>

const SHEET_NAME="Notes";

const FIELD_NAME="Notes";

async function start(){

try{

await tableau.extensions.initializeAsync();

const dashboard=tableau.extensions.dashboardContent.dashboard;

const sheet=dashboard.worksheets.find(x=>x.name===SHEET_NAME);

if(!sheet){

setText("Worksheet bulunamadı.");

return;

}

await refresh(sheet);

dashboard.worksheets.forEach(ws=>{

ws.addEventListener(

tableau.TableauEventType.FilterChanged,

()=>refresh(sheet)

);

});

}

catch(e){

setText(e.message);

console.error(e);

}

}

async function refresh(sheet){

const data=await sheet.getSummaryDataAsync();

const col=data.columns.findIndex(c=>c.fieldName===FIELD_NAME);

if(col<0){

setText("Kolon bulunamadı.");

return;

}

const txt=data.data

.map(r=>r[col].formattedValue)

.join("   ●   ");

setText(txt);

}

function setText(text){

const ticker=document.getElementById("ticker");

ticker.style.animation="none";

void ticker.offsetWidth;

ticker.innerHTML=text;

ticker.style.animation="marquee 25s linear infinite";

}

start();

</script>

</body>

</html>
